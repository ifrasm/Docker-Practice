events {}

http {

  upstream auth {
        server auth-service:80;
  }

  upstream product {
        server product-service:80;
  }

  upstream order {
        server order-service:80;
  }

  server {

      listen 80;

      location /auth/ {
          proxy_pass http://auth/;
      }

      location /products/ {
          proxy_pass http://product/;
      }

      location /orders/ {
          proxy_pass http://order/;
      }
  }
}
