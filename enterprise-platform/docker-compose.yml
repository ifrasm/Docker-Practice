version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: StrongPassword123
      POSTGRES_DB: enterprise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "5001:80"
    depends_on:
      - postgres
      - redis

  product-service:
    build:
      context: ./services/product-service
    ports:
      - "5002:80"
    depends_on:
      - postgres
      - redis

  order-service:
    build:
      context: ./services/order-service
    ports:
      - "5003:80"
    depends_on:
      - postgres
      - rabbitmq

  gateway:
    build:
      context: ./gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - product-service
      - order-service

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"

volumes:
  postgres_data:
